# Terminal-Bench 2.1 (the CURRENT benchmark) — runs on the HARBOR harness, not
# the old `tb` CLI. localharness is the agent under test via the Harbor adapter
# (adapters/terminal-bench/harbor_agent.py) driving `localharness work`.
# Manual dispatch; every model round spends real $LH from the throwaway
# identity behind LOCALHARNESS_KEY. ubuntu runners have the Docker Harbor needs.
name: terminal-bench-2.1

# Serialize any run that mutates the shared rolling `tbench-binary` release tag
# (this workflow AND tbench.yml share this group) so an overlapping run's delete
# window can't 404 a concurrent install curl mid-run.
concurrency:
  group: tbench-binary
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Harbor dataset id"
        default: "terminal-bench/terminal-bench-2-1"
        required: false
      n_tasks:
        description: "run the first N tasks (cost control; blank = all)"
        default: "2"
        required: false
      task:
        description: "specific task NAME within the dataset (overrides n_tasks when set)"
        default: ""
        required: false
      attempts:
        description: "attempts per task (pass@k)"
        default: "1"
        required: false
      model:
        description: "driving model id (blank = platform default gemini-3.7-flash; e.g. claude-sonnet-5 — a PREMIUM model billed 5 $LH/round, fund accordingly)"
        default: ""
        required: false

jobs:
  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: build static musl binary
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --features wallet,native,anthropic \
                --target x86_64-unknown-linux-musl --bin localharness
          cp target/x86_64-unknown-linux-musl/release/localharness localharness-x86_64-linux
      - name: publish to the tbench-binary rolling tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tbench-binary -y --cleanup-tag 2>/dev/null || true
          gh release create tbench-binary --title "tbench prebuilt binary" \
             --notes "Static x86_64 linux localharness for the Terminal-Bench adapters (rolling)." \
             localharness-x86_64-linux

  tbench2:
    needs: binary
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install harbor
        run: |
          # PINNED: the adapter (harbor_agent.py) is validated against 0.20.0's
          # BaseInstalledAgent contract + the (deprecated-but-working)
          # --agent-import-path flag. An unpinned install risks a future release
          # relocating modules or dropping the flag mid-expensive-run.
          pip install --quiet 'harbor==0.20.0'
          harbor --version || true
      - name: run terminal-bench 2.1
        working-directory: adapters/terminal-bench
        env:
          LOCALHARNESS_KEY: ${{ secrets.LOCALHARNESS_KEY }}
          # Harbor's import_symbol() does a plain importlib.import_module on the
          # module part of --agent-import-path — it does NOT add CWD to sys.path
          # (the old tb CLI did). Put the adapter dir on PYTHONPATH so
          # `harbor_agent:LocalharnessHarborAgent` resolves.
          PYTHONPATH: ${{ github.workspace }}/adapters/terminal-bench
        run: |
          set +e
          if [ -n "${{ inputs.task }}" ]; then
            # --task means a registry package ref (org/name[@ref]); selecting ONE
            # task from WITHIN the -d dataset is --include-task-name.
            SEL="--include-task-name ${{ inputs.task }}"
          elif [ -n "${{ inputs.n_tasks }}" ]; then
            SEL="--n-tasks ${{ inputs.n_tasks }}"
          else
            SEL=""
          fi
          # Pass the driving model through harbor's -m → the agent's
          # self.model_name → `work --model` (blank = platform default Flash).
          MODEL_FLAG=""
          [ -n "${{ inputs.model }}" ] && MODEL_FLAG="-m ${{ inputs.model }}"
          echo "harbor invocation: -d ${{ inputs.dataset }} $MODEL_FLAG $SEL"
          # -n 1 = ONE trial at a time. harbor's --n-concurrent (trial-level cap)
          # defaults to 4, which would fire 4 agents at the 504-prone proxy at
          # once — 4x peak cost + the exact overload that yields infra errors.
          # --n-concurrent-agents is only a PER-AGENT sub-cap, not the trial cap.
          harbor run \
            -d "${{ inputs.dataset }}" \
            --agent-import-path harbor_agent:LocalharnessHarborAgent \
            -k "${{ inputs.attempts }}" \
            -n 1 \
            --n-concurrent-agents 1 \
            $MODEL_FLAG $SEL
          echo "harbor exit: $?"
      - name: scoreline
        if: always()
        working-directory: adapters/terminal-bench
        run: |
          python - <<'PY'
          import json, glob, os
          # Harbor 2.x per-trial result.json: task_name is the clean string id
          # (task_id is a DICT — don't key on it), the verdict is
          # verifier_result.rewards.reward (>=1.0 = resolved). CRITICAL:
          # exception_info non-null = an INFRA error (e.g. a proxy 504), NOT a
          # model failure — it must be reported SEPARATELY and excluded from the
          # capability denominator, else a flaky proxy silently deflates the
          # score. Three states: ok / fail / err. Dedup by the trial uuid `id`.
          rows, seen = [], set()
          for f in glob.glob("**/result.json", recursive=True):
              try: d = json.load(open(f))
              except Exception: continue
              if not isinstance(d, dict) or "verifier_result" not in d:
                  continue  # skip the job-level roll-up; only per-trial files
              uid = d.get("id")
              if uid in seen: continue
              seen.add(uid)
              tid = d.get("task_name") or "?"
              errored = d.get("exception_info") is not None
              reward = ((d.get("verifier_result") or {}).get("rewards") or {}).get("reward", 0)
              if errored:
                  state = "err"
              elif reward is not None and reward >= 1.0:
                  state = "ok"
              else:
                  state = "fail"
              rows.append((tid, state))
          total = len(rows)
          resolved = sum(1 for _, s in rows if s == "ok")
          errored_ct = sum(1 for _, s in rows if s == "err")
          scored = total - errored_ct  # trustworthy denominator = completed trials
          acc = 100.0 * resolved / scored if scored else 0.0
          mark = {"ok": "✅", "fail": "❌", "err": "⚠️ infra-error (excluded)"}
          out = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")
          with open(out, "a") as fh:
              fh.write(
                  f"## Terminal-Bench 2.1: {resolved}/{scored} resolved on completed "
                  f"trials ({acc:.1f}%)"
                  + (f" — ⚠️ {errored_ct}/{total} trials errored (infra, NOT counted)\n\n"
                     if errored_ct else f" — {total} trials, 0 infra errors\n\n")
              )
              if errored_ct:
                  fh.write("> ⚠️ Infra errors (e.g. proxy 504s) are EXCLUDED from the "
                           "denominator — the score reflects capability, not proxy health. "
                           "Re-run the errored trials for a clean number.\n\n")
              fh.write("| task | verdict |\n|---|---|\n")
              for n, s in rows:
                  fh.write(f"| `{n}` | {mark[s]} |\n")
          print(f"SCORELINE 2.1: {resolved}/{scored} capability ({acc:.1f}%); "
                f"{errored_ct} infra-errored of {total} total")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tb2-runs
          path: |
            adapters/terminal-bench/runs
            adapters/terminal-bench/jobs
            adapters/terminal-bench/**/result.json
          if-no-files-found: warn
