# Terminal-Bench: run localharness as the agent under test on real TB tasks.
# Manual-dispatch only — every model round spends real $LH from the throwaway
# identity behind the LOCALHARNESS_KEY secret (provision + fund it first; see
# adapters/terminal-bench/README.md). ubuntu runners ship with Docker, which
# TB requires and dev machines may lack.
name: terminal-bench

# Shares the `tbench-binary` release tag with tbench2.yml — same concurrency
# group so neither run's delete+recreate window can 404 the other's install curl.
concurrency:
  group: tbench-binary
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      task_ids:
        description: "space-separated TB task ids"
        default: "hello-world"
        required: true
      dataset_name:
        description: "TB dataset name"
        default: "terminal-bench-core"
        required: false
      dataset_version:
        description: "TB dataset version"
        default: "0.1.1"
        required: false

jobs:
  # Build a static x86_64 Linux binary ONCE on the runner and publish it to a
  # release tag the container downloads (curl, ~seconds) — the in-container
  # cargo compile blew hello-world's 360s agent timeout. Fast install = the
  # task fits its own clock.
  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: build static musl binary
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --features wallet,native,anthropic \
                --target x86_64-unknown-linux-musl --bin localharness
          cp target/x86_64-unknown-linux-musl/release/localharness localharness-x86_64-linux
      - name: publish to the tbench-binary rolling tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tbench-binary -y --cleanup-tag 2>/dev/null || true
          gh release create tbench-binary --title "tbench prebuilt binary" \
             --notes "Static x86_64 linux localharness for the Terminal-Bench adapter (rolling)." \
             localharness-x86_64-linux

  tbench:
    needs: binary
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install terminal-bench
        run: |
          pip install --quiet terminal-bench
          tb --version || true
      - name: run tasks
        working-directory: adapters/terminal-bench
        env:
          LOCALHARNESS_KEY: ${{ secrets.LOCALHARNESS_KEY }}
        run: |
          set +e
          overall=0
          for t in ${{ inputs.task_ids }}; do
            echo "::group::task $t"
            tb run --agent-import-path localharness_agent:LocalharnessAgent \
                   --dataset-name "${{ inputs.dataset_name }}" \
                   --dataset-version "${{ inputs.dataset_version }}" \
                   --task-id "$t" --n-concurrent 1
            rc=$?
            echo "task $t exit: $rc"
            [ $rc -ne 0 ] && overall=$rc
            echo "::endgroup::"
          done
          # The harness exit code reflects harness health; task resolution
          # verdicts live in the uploaded runs/ artifact.
          exit $overall
      - name: scoreline
        if: always()
        working-directory: adapters/terminal-bench
        run: |
          # Aggregate every run's results.json into a GitHub Step Summary table
          # + fail the job if ANY task went unresolved (so a red X = a real
          # regression, not just harness health). Verdicts otherwise hide in
          # the artifact.
          python - <<'PY'
          import json, glob, os
          # Prefer each run's top-level results.json (one per `tb run` — it has
          # the full trial list); fall back to per-trial files. Dedup by
          # (task_id, trial_name) so overlapping globs don't double-count.
          rows, seen = [], set()
          for f in sorted(glob.glob("runs/**/results.json", recursive=True)):
              try:
                  d = json.load(open(f))
              except Exception:
                  continue
              trials = d.get("results")
              trials = trials if isinstance(trials, list) else [d]
              for r in trials:
                  if not isinstance(r, dict) or "task_id" not in r:
                      continue
                  key = (r.get("task_id"), r.get("trial_name"))
                  if key in seen:
                      continue
                  seen.add(key)
                  rows.append((r["task_id"], bool(r.get("is_resolved", False))))
          total = len(rows)
          resolved = sum(1 for _, ok in rows if ok)
          acc = (100.0 * resolved / total) if total else 0.0
          rows = [(n, "✅ resolved" if ok else "❌ unresolved") for n, ok in rows]
          out = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")
          with open(out, "a") as fh:
              fh.write(f"## Terminal-Bench: {resolved}/{total} resolved ({acc:.1f}%)\n\n")
              fh.write("| task | verdict |\n|---|---|\n")
              for n, v in rows:
                  fh.write(f"| `{n}` | {v} |\n")
          print(f"SCORELINE {resolved}/{total} ({acc:.1f}%)")
          raise SystemExit(0 if total and resolved == total else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tb-runs
          path: adapters/terminal-bench/runs
          if-no-files-found: warn
