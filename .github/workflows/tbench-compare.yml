# Terminal-Bench 2.1 — SAME-MODEL harness comparison: localharness vs the harbor
# reference agent (terminus-2), holding the model constant so the delta is
# HARNESS scaffolding, not model capability. This is the experiment that answers
# "how do we compare to other harnesses."
#
# Two arms, SAME dataset + SAME task subset + SAME underlying model:
#   • localharness — our Harbor adapter (harbor_agent.py) driving `localharness
#     work`, model via OUR credit proxy (auth = LOCALHARNESS_KEY). Proxy id form,
#     e.g. `gemini-3.6-flash`.
#   • terminus-2   — harbor's built-in reference agent, model via litellm DIRECT
#     to the provider (auth = GEMINI_API_KEY / ANTHROPIC_API_KEY). litellm id
#     form, e.g. `gemini/gemini-3.6-flash` → the SAME Google model our proxy
#     forwards to.
#
# Defaults to gemini-flash: cheap, and it does NOT hit the claude proxy-504, so
# this runs TODAY (once GEMINI_API_KEY is set) without waiting on the 504 fix.
# For a claude comparison: model_lh=claude-sonnet-5,
# model_terminus=anthropic/claude-sonnet-5, add ANTHROPIC_API_KEY, and land the
# proxy 504 fix first (design/proxy-504-fix.md).
#
# ⚠️ REQUIRES a new GH secret GEMINI_API_KEY (a Google AI Studio key) for the
# terminus-2 arm — litellm bills it directly (tiny for flash). Without it, the
# terminus arm SELF-SKIPS and only the localharness arm runs.
#
# Extras (2026-08-01, the beat-78% campaign): `arms` picks which base arms run
# (a full-set localharness-only baseline doesn't need to re-pay for terminus —
# published numbers exist); `n_tasks: all` runs the whole dataset (needs
# `n_concurrent` 3-4 to fit the 6h job cap; watch runner disk/RAM); `arm_c`
# adds a third harbor-registry agent (gemini-cli / antigravity-sdk — the
# Antigravity comparison; antigravity-* installs a pinned harbor dev build in
# an isolated venv, arms A/B stay on 0.20.0).
name: terminal-bench-compare

concurrency:
  group: tbench-binary
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Harbor dataset id"
        default: "terminal-bench/terminal-bench-2-1"
        required: false
      n_tasks:
        description: "first N tasks of the dataset (SAME subset for all arms) — or 'all' for the whole set"
        default: "5"
        required: false
      attempts:
        description: "attempts per task (pass@k)"
        default: "1"
        required: false
      arms:
        description: "which base arms to run: both | localharness | terminus"
        default: "both"
        required: false
      arm_c:
        description: "optional third arm (harbor agent id): none | gemini-cli | antigravity-sdk | antigravity-cli"
        default: "none"
        required: false
      n_concurrent:
        description: "concurrent agents per arm (raise for full-set runs; watch runner disk/RAM)"
        default: "1"
        required: false
      model_lh:
        description: "localharness arm model (our proxy id form)"
        default: "gemini-3.6-flash"
        required: false
      model_terminus:
        description: "terminus-2 arm model (litellm id form — SAME underlying model)"
        default: "gemini/gemini-3.6-flash"
        required: false
      model_c:
        description: "arm C model id (litellm form; antigravity-sdk may want google/... prefix)"
        default: "gemini/gemini-3.6-flash"
        required: false

jobs:
  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: build static musl binary
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --features wallet,native,anthropic \
                --target x86_64-unknown-linux-musl --bin localharness
          cp target/x86_64-unknown-linux-musl/release/localharness localharness-x86_64-linux
      - name: publish to the tbench-binary rolling tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tbench-binary -y --cleanup-tag 2>/dev/null || true
          gh release create tbench-binary --title "tbench prebuilt binary" \
             --notes "Static x86_64 linux localharness for the Terminal-Bench adapters (rolling)." \
             localharness-x86_64-linux

  compare:
    needs: binary
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install harbor
        run: pip install --quiet 'harbor==0.20.0'
      # 'all' → no -l cap (whole dataset). Shared by every arm step below.
      - name: task-limit flag
        run: |
          if [ "${{ inputs.n_tasks }}" = "all" ]; then echo "L_FLAG=" >> "$GITHUB_ENV";
          else echo "L_FLAG=-l ${{ inputs.n_tasks }}" >> "$GITHUB_ENV"; fi
      - name: "arm A — localharness (our proxy)"
        if: ${{ inputs.arms == 'both' || inputs.arms == 'localharness' }}
        env:
          LOCALHARNESS_KEY: ${{ secrets.LOCALHARNESS_KEY }}
          PYTHONPATH: ${{ github.workspace }}/adapters/terminal-bench
        run: |
          set +e
          mkdir -p arms/localharness && cd arms/localharness
          echo "== localharness arm: -d ${{ inputs.dataset }} -m ${{ inputs.model_lh }} $L_FLAG x${{ inputs.n_concurrent }} =="
          harbor run \
            -d "${{ inputs.dataset }}" \
            --agent-import-path harbor_agent:LocalharnessHarborAgent \
            -m "${{ inputs.model_lh }}" \
            -k "${{ inputs.attempts }}" -n "${{ inputs.n_concurrent }}" --n-concurrent-agents "${{ inputs.n_concurrent }}" \
            $L_FLAG
          echo "localharness arm exit: $?"
      - name: "arm B — terminus-2 (harbor reference, litellm direct)"
        if: ${{ inputs.arms == 'both' || inputs.arms == 'terminus' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::No provider key secret (GEMINI_API_KEY / ANTHROPIC_API_KEY / OPENAI_API_KEY) set — SKIPPING the terminus-2 arm. Add one to enable the head-to-head."
            exit 0
          fi
          mkdir -p arms/terminus && cd arms/terminus
          echo "== terminus-2 arm: -d ${{ inputs.dataset }} -m ${{ inputs.model_terminus }} $L_FLAG x${{ inputs.n_concurrent }} =="
          harbor run \
            -d "${{ inputs.dataset }}" \
            --agent terminus-2 \
            -m "${{ inputs.model_terminus }}" \
            -k "${{ inputs.attempts }}" -n "${{ inputs.n_concurrent }}" --n-concurrent-agents "${{ inputs.n_concurrent }}" \
            $L_FLAG
          echo "terminus-2 arm exit: $?"
      # Arm C: any harbor-registry agent by id (gemini-cli in 0.20.0; the
      # antigravity-sdk/-cli agents postdate 0.20.0 → installed from a pinned
      # dev build in an isolated venv so arms A/B stay on the pinned harbor).
      # antigravity-cli additionally needs a pre-provisioned OAuth token
      # (AGY_AUTH_JSON_PATH) — without it, expect the arm to fail honestly.
      - name: "arm C — ${{ inputs.arm_c }} (harbor agent, litellm direct)"
        if: ${{ inputs.arm_c != 'none' && inputs.arm_c != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::No GEMINI_API_KEY secret — SKIPPING arm C (${{ inputs.arm_c }})."
            exit 0
          fi
          HARBOR=harbor
          case "${{ inputs.arm_c }}" in
            antigravity-*)
              python -m venv /tmp/agy-venv
              /tmp/agy-venv/bin/pip install --quiet 'harbor==0.20.1.dev202608010130'
              HARBOR=/tmp/agy-venv/bin/harbor
              ;;
          esac
          mkdir -p "arms/${{ inputs.arm_c }}" && cd "arms/${{ inputs.arm_c }}"
          echo "== arm C ${{ inputs.arm_c }}: -d ${{ inputs.dataset }} -m ${{ inputs.model_c }} $L_FLAG x${{ inputs.n_concurrent }} =="
          "$HARBOR" run \
            -d "${{ inputs.dataset }}" \
            --agent "${{ inputs.arm_c }}" \
            -m "${{ inputs.model_c }}" \
            -k "${{ inputs.attempts }}" -n "${{ inputs.n_concurrent }}" --n-concurrent-agents "${{ inputs.n_concurrent }}" \
            $L_FLAG
          echo "arm C exit: $?"
      - name: scoreline (side-by-side)
        if: always()
        run: |
          python - <<'PY'
          import json, glob, os
          # Score one arm's dir into {task: state}, state in ok/fail/err. Infra
          # errors (exception_info) are EXCLUDED from the capability denominator.
          def score(arm_dir):
              out, seen = {}, set()
              for f in glob.glob(f"{arm_dir}/**/result.json", recursive=True):
                  try: d = json.load(open(f, encoding="utf-8"))
                  except Exception: continue
                  if not isinstance(d, dict) or "verifier_result" not in d: continue
                  uid = d.get("id")
                  if uid in seen: continue
                  seen.add(uid)
                  tid = d.get("task_name") or "?"
                  err = d.get("exception_info") is not None
                  rew = ((d.get("verifier_result") or {}).get("rewards") or {}).get("reward", 0)
                  out[tid] = "err" if err else ("ok" if (rew is not None and rew >= 1.0) else "fail")
              return out
          arms = {}
          if os.path.isdir("arms"):
              for name in sorted(os.listdir("arms")):
                  if os.path.isdir(os.path.join("arms", name)):
                      arms[name] = score(os.path.join("arms", name))
          def tally(d):
              resolved = sum(1 for s in d.values() if s == "ok")
              errored  = sum(1 for s in d.values() if s == "err")
              scored   = len(d) - errored
              acc = 100.0 * resolved / scored if scored else 0.0
              return resolved, scored, errored, acc
          mark = {"ok": "✅", "fail": "❌", "err": "⚠️"}
          tasks = sorted(set().union(*arms.values())) if arms else []
          out = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")
          with open(out, "a") as fh:
              fh.write("## Harness comparison — Terminal-Bench 2.1 (same model)\n\n")
              for name, d in arms.items():
                  r, s, e, a = tally(d)
                  fh.write(f"- **{name}**: {r}/{s} resolved ({a:.1f}%)"
                           + (f", ⚠️{e} infra-errored\n" if e else "\n"))
              if "localharness" in arms and arms.get("terminus"):
                  delta = tally(arms["localharness"])[3] - tally(arms["terminus"])[3]
                  fh.write(f"\n**Δ (localharness − terminus-2): {delta:+.1f} pts** "
                           "— same model, same tasks, so this is the harness delta.\n")
              fh.write("\n| task | " + " | ".join(arms) + " |\n|---|" + "---|" * len(arms) + "\n")
              for t in tasks:
                  fh.write(f"| `{t}` | " + " | ".join(mark.get(d.get(t), "—") for d in arms.values()) + " |\n")
          line = " vs ".join(f"{n}={tally(d)[0]}/{tally(d)[1]} ({tally(d)[3]:.1f}%)" for n, d in arms.items())
          print("COMPARE " + (line or "no arms ran"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tb-compare-runs
          # The WHOLE arms tree (both jobs/ dirs incl. per-trial agent logs +
          # verifier output), not just result.json — a comparison is only useful
          # if you can read WHY each arm lost a task, and the transcripts live in
          # the trial dirs (harbor collects the adapter's /logs/agent output).
          path: arms
          if-no-files-found: warn
